[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webapp-backend"
version = "1.0.0"
description = "Production-ready FastAPI starter with JWT auth, RBAC, and a layered module structure"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.3.0",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "slowapi==0.1.10",
]

[project.optional-dependencies]
mysql = ["asyncmy==0.2.11"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "ruff==0.15.20",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "C4", "PT", "RUF"]
ignore = [
    "B008",  # FastAPI uses Depends()/Query() in argument defaults
    "RUF012",  # SQLAlchemy/Pydantic class attributes are intentionally mutable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/cli.py" = ["S105"]
# Alembic's own HeadMaintainer patch for SingleStore, kept close to the upstream code.
"alembic/env.py" = ["S101", "UP031"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
