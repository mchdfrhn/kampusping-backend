[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "his-standard-backend"
version = "1.0.0"
description = "Official HIS FastAPI backend starter for PT. Hino Motors Sales Indonesia"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
postgresql = ["asyncpg==0.31.0"]
mysql = ["asyncmy==0.2.11"]
singlestore = ["singlestoredb==1.17.0", "sqlalchemy-singlestoredb==1.2.1"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.15.20"]
all = [
    "asyncpg==0.31.0",
    "asyncmy==0.2.11",
    "singlestoredb==1.17.0",
    "sqlalchemy-singlestoredb==1.2.1",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
